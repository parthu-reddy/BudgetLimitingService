apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-pacing-service
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-pacing-service
  template:
    metadata:
      labels:
        app: budget-pacing-service
    spec:
      containers:
      - env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        envFrom:
        - configMapRef:
            name: advertisement-config
        image: food-delivery/budget-pacing-service:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/liveness
            port: 8103
          initialDelaySeconds: 45
          periodSeconds: 10
        name: budget-pacing-service
        ports:
        - containerPort: 8103
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health/readiness
            port: 8103
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
