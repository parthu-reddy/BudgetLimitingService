spring:
  config:
    import: ""
  redis:
    enabled: false
  main:
    allow-bean-definition-overriding: true
    web-application-type: none
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: none
  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
    - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
    - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: contract-test-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
eureka:
  client:
    enabled: false
management:
  health:
    redis:
      enabled: false
r2:
  endpoint: http://dummy
  bucket-name: dummy
  public-url: http://dummy
  access-key: dummy
  secret-key: dummy
olamaps:
  api:
    key: dummy
brevo:
  api:
    key: dummy
exotel:
  api:
    key: dummy
twilio:
  api:
    key: dummy
stripe:
  api:
    key: dummy
razorpay:
  api:
    key: dummy
ondc:
  api:
    key: dummy
delivery:
  executive:
    radius: 5.0
campaign-service:
  # CampaignClient sets an explicit @FeignClient url, which bypasses service discovery, so the
  # stub-runner service-id registration does not apply and this must be a port known up front.
  # A ${stubrunner.runningstubs...} placeholder does NOT work here: Feign resolves its url when the
  # client bean is created, before stub runner registers those properties, and the context fails
  # with "is malformed".
  #
  # A fixed port is safe here only because 8095 is bound by no other module. That is the actual
  # invariant for a parallel build -- no two modules may share a port -- so if you add a stub runner
  # anywhere else, do not reuse 8095.
  url: http://localhost:8095
platform:
  auction:
    token-secret: contract-test-secret
