spring:
  config:
    import: optional:classpath:config/platform-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: budget-pacing-service
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 2000ms
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/budget_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks it matches the entities. This service owns no
      # entities of its own -- outbox_events and idempotency_keys come from common-library's
      # db/migration/common migrations, which ship inside the jar and are picked up by Flyway's
      # recursive classpath:db/migration scan. Quartz still self-initialises via
      # spring.quartz.jdbc.initialize-schema above.
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
server:
  port: 8103
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
